name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for browser integration tests
        run: npx playwright install --with-deps chromium
      - name: Run tests
        env:
          BROWSER_HEADLESS: "true"
          BROWSERLESS_URL: ""
        run: npm test
